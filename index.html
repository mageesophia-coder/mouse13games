
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse 13 Games</title>
<meta name="description" content="Play free online games at Mouse 13 Games, including Snake, Memory, Tic Tac Toe, 2048, Minesweeper, and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120a2e;
    --card: #241660;
    --text: #ffffff;
    --muted: #b6a9e8;
    --pink: #ff4fa3;
    --cyan: #22e4ff;
    --yellow: #ffd23f;
    --green: #3dff9a;
    --red: #ff5d73;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(1100px 600px at 15% -10%, #4b22b8 0, transparent 60%),
      radial-gradient(900px 500px at 105% 0, #a3239c 0, transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  a { color: inherit; text-decoration: none; }
  .hidden { display: none !important; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: rgba(18, 10, 46, .85);
    backdrop-filter: blur(10px);
    border-bottom: 3px solid var(--pink);
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-emoji { font-size: 2rem; }
  .logo-text { display: flex; flex-direction: column; line-height: 1; }
  .logo-text b {
    font-size: 1.25rem; letter-spacing: .04em;
    background: linear-gradient(90deg, var(--cyan), var(--pink), var(--yellow));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .logo-text i { font-size: .8rem; color: var(--muted); font-style: normal; margin-top: 3px; }
  .topbar .spacer { flex: 1; }
  .topnav { display: flex; gap: 8px; }

  .btn {
    font-family: inherit; font-weight: 600; font-size: 1rem;
    border: 0; border-radius: 999px; cursor: pointer;
    padding: 10px 20px; color: #1b0a40;
    background: linear-gradient(180deg, var(--yellow), #ffae00);
    box-shadow: 0 4px 0 #b97a00;
    transition: transform .08s, box-shadow .08s;
    display: inline-block;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b97a00; }
  .btn.ghost { background: #3a2a85; color: #fff; box-shadow: 0 4px 0 #22175a; }
  .btn.ghost:active { box-shadow: 0 1px 0 #22175a; }
  .btn.small { padding: 6px 14px; font-size: .9rem; }

  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; }

  /* Hero */
  .hero { text-align: center; padding: 18px 0 8px; }
  .hero-emoji { font-size: 2.2rem; letter-spacing: .3em; }
  .hero h1 {
    margin: 4px 0 0; font-size: clamp(2.2rem, 8vw, 4.2rem); line-height: 1;
    text-transform: uppercase; letter-spacing: .02em;
    background: linear-gradient(90deg, var(--cyan), var(--pink) 50%, var(--yellow));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.35));
  }
  .tagline { margin: 6px 0 14px; font-size: 1.5rem; color: var(--yellow); font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .pills span {
    padding: 5px 14px; border-radius: 999px; font-size: .9rem; font-weight: 500;
    background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.18);
  }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 12px; }
  .controls input {
    flex: 1 1 240px; font-family: inherit; font-size: 1.05rem;
    padding: 12px 18px; border-radius: 999px; border: 3px solid var(--cyan);
    background: #1b0f4a; color: #fff; outline: none;
  }
  .controls input::placeholder { color: var(--muted); }
  .controls input:focus { border-color: var(--yellow); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    font-family: inherit; font-weight: 600; font-size: .95rem; cursor: pointer;
    padding: 7px 16px; border-radius: 999px; color: #fff;
    background: #2f2078; border: 2px solid #4b38a8;
  }
  .chip.active { background: var(--pink); border-color: #fff; }

  /* Game grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 16px; }
  .grid.mini { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .card {
    position: relative; display: flex; flex-direction: column;
    border-radius: 20px; overflow: hidden; cursor: pointer;
    background: linear-gradient(145deg, var(--c1), var(--c2));
    border: 4px solid rgba(255,255,255,.9);
    box-shadow: 0 8px 0 rgba(0,0,0,.35);
    transition: transform .12s, box-shadow .12s;
  }
  .card:hover { transform: translateY(-5px) rotate(-1deg) scale(1.03); box-shadow: 0 13px 0 rgba(0,0,0,.35); }
  .card .art {
    display: grid; place-items: center; aspect-ratio: 1.15;
    font-size: 4rem; text-shadow: 0 6px 0 rgba(0,0,0,.25);
  }
  .mini .card .art { font-size: 2.6rem; }
  .card .meta {
    display: flex; flex-direction: column; gap: 3px; padding: 9px 12px 11px;
    background: rgba(10, 4, 35, .55);
  }
  .card .name { font-weight: 700; font-size: 1.1rem; line-height: 1.1; }
  .mini .card .name { font-size: .95rem; }
  .card .sub { font-size: .8rem; color: #ffe9a8; display: flex; justify-content: space-between; gap: 6px; }
  .badge {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    background: var(--red); color: #fff; font-size: .75rem; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; border: 2px solid #fff;
    transform: rotate(-6deg);
  }
  .badge.new { background: var(--green); color: #05361d; }
  .empty { text-align: center; color: var(--muted); font-size: 1.2rem; padding: 30px; }

  footer {
    text-align: center; padding: 26px 16px 36px; color: var(--muted); font-size: .95rem;
  }
  footer b { color: var(--yellow); }

  /* Game view */
  .gv-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .gv-top h2 { margin: 0; flex: 1; font-size: 1.7rem; }
  .stats { display: flex; justify-content: center; gap: 12px; margin: 16px 0 6px; }
  .stats div {
    background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2);
    border-radius: 14px; padding: 6px 18px; color: var(--muted); font-size: .95rem;
  }
  .stats b { color: #fff; font-size: 1.35rem; margin-left: 6px; }
  .status { text-align: center; min-height: 1.6em; margin-bottom: 8px; color: var(--yellow); font-weight: 600; }
  .stage { display: flex; flex-direction: column; align-items: center; }
  .board { position: relative; display: inline-block; max-width: 100%; }
  .game-canvas {
    display: block; height: auto; border-radius: 16px; touch-action: none;
    border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 0 rgba(0,0,0,.35); background: #000;
  }
  .overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(12, 5, 38, .82); border-radius: 14px; text-align: center; padding: 20px;
  }
  .overlay h2 { margin: 0; font-size: 2rem; color: var(--yellow); }
  .overlay p { margin: 0; color: #e5defc; max-width: 300px; }
  .how { text-align: center; color: var(--muted); margin: 16px auto 4px; max-width: 560px; }
  .more-title { margin: 28px 0 12px; font-size: 1.3rem; }

  .dpad { display: none; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 58px); gap: 8px; margin-top: 16px; }
  .dpad button {
    border: 0; border-radius: 14px; font-size: 1.4rem; color: #fff; background: #3a2a85;
    box-shadow: 0 4px 0 #22175a; cursor: pointer;
  }
  .dpad button:active { transform: translateY(3px); box-shadow: none; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) { .dpad { display: grid; } }

  /* Memory */
  .mem-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    width: min(92vw, 400px); padding: 14px; background: #1b0f4a; border-radius: 18px;
    border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 0 rgba(0,0,0,.35);
  }
  .mem-card {
    aspect-ratio: 1; border: 0; border-radius: 14px; cursor: pointer; padding: 0;
    font-family: inherit; font-weight: 700; font-size: clamp(28px, 9vw, 46px); color: #fff;
    background: linear-gradient(135deg, var(--pink), #7c3aed);
    display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.3);
  }
  .mem-card:active { transform: scale(.96); }
  .mem-card .back { display: none; }
  .mem-card.open, .mem-card.done { background: #fff; }
  .mem-card.open .back, .mem-card.done .back { display: block; }
  .mem-card.open .front, .mem-card.done .front { display: none; }
  .mem-card.done { background: #c7f9d4; opacity: .7; }

  /* Tic Tac Toe */
  .ttt {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    width: min(88vw, 340px); padding: 14px; background: #1b0f4a; border-radius: 18px;
    border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 0 rgba(0,0,0,.35);
  }
  .ttt button {
    aspect-ratio: 1; border: 0; border-radius: 14px; cursor: pointer; padding: 0;
    font-family: inherit; font-weight: 700; font-size: clamp(40px, 15vw, 68px);
    background: #3a2a85; color: #fff;
  }
  .ttt button.x { color: var(--cyan); }
  .ttt button.o { color: var(--yellow); }
  .ttt button.win { background: #1f8f5a; }

  /* Number merge */
  .n2048 {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    width: min(92vw, 400px); padding: 10px; background: #3b2a78; border-radius: 16px;
    border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 0 rgba(0,0,0,.35);
    touch-action: none;
  }
  .tile {
    aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center;
    font-weight: 700; font-size: clamp(20px, 7.5vw, 36px); background: #5b46a8; color: #fff;
  }
  .tile.v2 { background: #eee4da; color: #776e65; }
  .tile.v4 { background: #ede0c8; color: #776e65; }
  .tile.v8 { background: #f2b179; color: #fff; }
  .tile.v16 { background: #f59563; color: #fff; }
  .tile.v32 { background: #f67c5f; color: #fff; }
  .tile.v64 { background: #f65e3b; color: #fff; }
  .tile.v128 { background: #edcf72; color: #fff; font-size: clamp(18px, 6.5vw, 30px); }
  .tile.v256 { background: #edcc61; color: #fff; font-size: clamp(18px, 6.5vw, 30px); }
  .tile.v512 { background: #edc850; color: #fff; font-size: clamp(18px, 6.5vw, 30px); }
  .tile.v1024 { background: #edc53f; color: #fff; font-size: clamp(15px, 5.5vw, 26px); }
  .tile.v2048 { background: #edc22e; color: #fff; font-size: clamp(15px, 5.5vw, 26px); }
  .tile.vbig { background: #3c3a32; color: #fff; font-size: clamp(14px, 5vw, 24px); }

  /* Whack */
  .whack {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    width: min(92vw, 390px); padding: 16px; background: #2f8f3a; border-radius: 18px;
    border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 0 rgba(0,0,0,.35);
  }
  .hole {
    aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; cursor: pointer;
    position: relative; overflow: hidden; touch-action: manipulation;
    background: radial-gradient(circle at 50% 70%, #1e1006 0, #4a2e12 60%, #6b4421 100%);
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.35);
  }
  .critter {
    position: absolute; left: 50%; bottom: -70%; transform: translateX(-50%);
    font-size: clamp(36px, 13vw, 66px); transition: bottom .1s; pointer-events: none;
  }
  .hole.up .critter { bottom: 10%; }

  /* Minesweeper */
  .mines-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mines {
    --cs: min(36px, 9.6vw);
    display: grid; grid-template-columns: repeat(9, var(--cs)); gap: 2px; padding: 8px;
    background: #2a1b66; border-radius: 14px;
    border: 4px solid rgba(255,255,255,.9); box-shadow: 0 8px 0 rgba(0,0,0,.35);
  }
  .mcell {
    width: var(--cs); height: var(--cs); border: 0; border-radius: 6px; padding: 0; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: calc(var(--cs) * .55);
    background: #8b7fe0; color: #fff;
  }
  .mcell.open { background: #e9e4ff; cursor: default; }
  .mcell.bomb { background: #ffb3b3; }
  .mcell.boom { background: #ff4d4d; }
  .mcell.n1 { color: #2563eb; } .mcell.n2 { color: #16a34a; } .mcell.n3 { color: #dc2626; }
  .mcell.n4 { color: #7e22ce; } .mcell.n5 { color: #b45309; } .mcell.n6 { color: #0891b2; }
  .mcell.n7 { color: #111; } .mcell.n8 { color: #6b7280; }

  @media (max-width: 560px) {
    .topbar { padding: 8px 12px; }
    .logo-text b { font-size: 1rem; }
    .logo-emoji { font-size: 1.6rem; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card .art { font-size: 3.2rem; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/" aria-label="Mouse 13 Games home">
      <span class="logo-emoji">🐭</span>
      <span class="logo-text"><b>MOUSE 13 GAMES</b><i>js like me</i></span>
    </a>
    <span class="spacer"></span>
    <nav class="topnav"><a class="btn small" href="#/">🏠 Home</a></nav>
  </header>

  <main id="app"></main>

  <footer>
    <b>Mouse 13 Games</b> · js like me 😎 · made for fun, play as much as you want
  </footer>

<script>
(() => {
  /* ---------- tiny helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const store = {
    get(k) { try { const v = localStorage.getItem('bwe-' + k); return v === null ? null : JSON.parse(v); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('bwe-' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const canvasPos = (c, e) => {
    const r = c.getBoundingClientRect();
    return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height };
  };
  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  /* =====================================================
     GAME 1: SNAKE (levels + lives)
     ===================================================== */
  function snakeGame(api) {
    const c = api.canvas(420, 420), ctx = c.getContext('2d');
    const GRID = 21, CELL = c.width / GRID, MID = 10;
    const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const FOODS_PER_LEVEL = 5, START_LIVES = 3, MAX_LIVES = 5;
    let state = 'idle', snake, dir, nextDir, food = null, obstacles = [];
    let score = 0, level = 1, lives = START_LIVES, foodsEaten = 0, timer = null;
    let bannerText = '', bannerUntil = 0;

    api.onCleanup(() => clearTimeout(timer));

    const isObstacle = (x, y) => obstacles.some(o => o.x === x && o.y === y);
    const isSnake = (x, y) => snake.some(s => s.x === x && s.y === y);

    function hud() {
      api.setScore(score);
      api.status('Level ' + level + '   ·   Lives ' + '♥'.repeat(lives) + '♡'.repeat(MAX_LIVES - lives));
    }
    function spawnSnake() {
      snake = [{ x: MID, y: MID }, { x: MID - 1, y: MID }, { x: MID - 2, y: MID }];
      dir = DIRS.right; nextDir = dir;
    }
    function makeObstacles() {
      obstacles = [];
      const count = Math.min(4 * (level - 1), 28);
      const head = snake[0];
      let tries = 0;
      while (obstacles.length < count && tries < 2000) {
        tries++;
        const x = randInt(0, GRID - 1), y = randInt(0, GRID - 1);
        const safe = Math.abs(y - MID) <= 1 && x >= MID - 3 && x <= MID + 6;
        const near = Math.abs(x - head.x) + Math.abs(y - head.y) <= 3;
        if (safe || near || isSnake(x, y) || isObstacle(x, y)) continue;
        if (food && food.x === x && food.y === y) continue;
        obstacles.push({ x, y });
      }
    }
    function placeFood() {
      for (;;) {
        const f = { x: randInt(0, GRID - 1), y: randInt(0, GRID - 1) };
        if (!isSnake(f.x, f.y) && !isObstacle(f.x, f.y)) { food = f; return; }
      }
    }
    function newGame() {
      score = 0; level = 1; lives = START_LIVES; foodsEaten = 0; bannerUntil = 0; obstacles = [];
      spawnSnake(); placeFood(); hud();
    }
    const speed = () => Math.max(55, 140 - level * 9);
    function start() {
      newGame(); state = 'running'; api.hideOverlay();
      banner('Level 1'); schedule(); draw();
    }
    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(() => { tick(); if (state === 'running') schedule(); }, speed());
    }
    function banner(t) { bannerText = t; bannerUntil = Date.now() + 1400; }
    function setDir(name) {
      const d = DIRS[name];
      if (!d) return;
      if (d[0] === -dir[0] && d[1] === -dir[1]) return;
      nextDir = d;
    }
    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
      const wall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
      if (wall || isSnake(head.x, head.y) || isObstacle(head.x, head.y)) return loseLife();
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += level; foodsEaten++;
        if (foodsEaten % FOODS_PER_LEVEL === 0) {
          level++; lives = Math.min(MAX_LIVES, lives + 1);
          makeObstacles(); banner('Level ' + level + '!');
        }
        placeFood(); hud();
      } else snake.pop();
      draw();
    }
    function loseLife() {
      clearTimeout(timer);
      lives--; hud();
      if (lives <= 0) return gameOver();
      state = 'lifelost';
      spawnSnake();
      if (isObstacle(food.x, food.y) || isSnake(food.x, food.y)) placeFood();
      draw();
      api.overlay('Ouch! 💥', lives + (lives === 1 ? ' life' : ' lives') + ' left. Level ' + level + '.', 'Continue', primary);
    }
    function gameOver() {
      state = 'over'; api.finish(score); draw();
      api.overlay('Game over', 'Score ' + score + ' · reached level ' + level, 'Play again', primary);
    }
    function pause() {
      if (state !== 'running') return;
      state = 'paused'; clearTimeout(timer);
      api.overlay('Paused', 'Press Space to resume.', 'Resume', primary);
    }
    function resume() { state = 'running'; api.hideOverlay(); schedule(); }
    function primary() {
      if (state === 'idle' || state === 'over') start();
      else if (state === 'running') pause();
      else resume();
    }
    function draw() {
      ctx.fillStyle = '#181c30'; ctx.fillRect(0, 0, c.width, c.height);
      for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
        if ((x + y) % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(x * CELL, y * CELL, CELL, CELL); }
      }
      obstacles.forEach(o => {
        ctx.fillStyle = '#6a72a0'; roundRect(ctx, o.x * CELL + 1.5, o.y * CELL + 1.5, CELL - 3, CELL - 3, 4); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(o.x * CELL + 4, o.y * CELL + 4, CELL - 8, 3);
      });
      ctx.fillStyle = '#f87171'; ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2); ctx.fill();
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#86efac' : '#4ade80';
        roundRect(ctx, s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, 5); ctx.fill();
      });
      const h = snake[0], cx = h.x * CELL, cy = h.y * CELL;
      ctx.fillStyle = '#062b14';
      const offs = dir[0] !== 0
        ? [[dir[0] > 0 ? 0.65 : 0.35, 0.3], [dir[0] > 0 ? 0.65 : 0.35, 0.7]]
        : [[0.3, dir[1] > 0 ? 0.65 : 0.35], [0.7, dir[1] > 0 ? 0.65 : 0.35]];
      offs.forEach(([ox, oy]) => { ctx.beginPath(); ctx.arc(cx + ox * CELL, cy + oy * CELL, CELL * 0.08, 0, Math.PI * 2); ctx.fill(); });
      if (Date.now() < bannerUntil) {
        ctx.fillStyle = 'rgba(15,18,32,0.7)'; ctx.fillRect(0, c.height / 2 - 34, c.width, 68);
        ctx.fillStyle = '#4ade80'; ctx.font = 'bold 34px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(bannerText, c.width / 2, c.height / 2);
      }
    }

    const keymap = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
    };
    api.on(window, 'keydown', e => {
      if (keymap[e.key]) { e.preventDefault(); setDir(keymap[e.key]); }
      else if (e.key === ' ') { e.preventDefault(); if (!e.repeat) primary(); }
    });
    api.dpad(setDir);
    let tx = 0, ty = 0;
    api.on(c, 'pointerdown', e => { tx = e.clientX; ty = e.clientY; });
    api.on(c, 'pointerup', e => {
      const dx = e.clientX - tx, dy = e.clientY - ty;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left'); else setDir(dy > 0 ? 'down' : 'up');
    });

    newGame(); draw();
    api.overlay('Snake 🐍', 'Arrow keys / WASD or swipe. Eat 5 apples to level up. You get 3 lives!', 'Play', primary);
  }

  /* =====================================================
     GAME 2: FLAPPY BLOB
     ===================================================== */
  function flappyGame(api) {
    const W = 360, H = 540, GROUND = 84, PW = 56, GAP = 150, R = 15;
    const c = api.canvas(W, H), g = c.getContext('2d');
    let bird, pipes, score, state = 'idle', spawn, scroll = 0, deadAt = 0, t = 0;

    function reset() { bird = { x: 96, y: 240, vy: 0 }; pipes = []; score = 0; spawn = 0.7; api.setScore(0); }
    function begin() { reset(); state = 'play'; bird.vy = -330; api.hideOverlay(); }
    function flap() {
      if (state === 'play') bird.vy = -335;
      else if (performance.now() - deadAt > 500) begin();
    }
    function die() {
      if (state !== 'play') return;
      state = 'dead'; deadAt = performance.now(); api.finish(score);
      api.overlay('Game over 💥', 'Score: ' + score, 'Play again', begin);
    }
    api.on(window, 'keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) flap(); }
    });
    api.on(c, 'pointerdown', e => { e.preventDefault(); flap(); });

    api.loop(dt => {
      t += dt;
      if (state === 'idle') bird.y = 240 + Math.sin(t * 4) * 8;
      if (state === 'play') {
        bird.vy += 1250 * dt; bird.y += bird.vy * dt;
        scroll = (scroll + 150 * dt) % 24;
        spawn -= dt;
        if (spawn <= 0) { pipes.push({ x: W + 10, gap: randInt(130, H - GROUND - 130), scored: false }); spawn = 1.5; }
        pipes.forEach(p => p.x -= 150 * dt);
        pipes = pipes.filter(p => p.x > -PW - 10);
        for (const p of pipes) {
          if (!p.scored && p.x + PW < bird.x) { p.scored = true; score++; api.setScore(score); }
          if (bird.x + R > p.x && bird.x - R < p.x + PW && (bird.y - R < p.gap - GAP / 2 || bird.y + R > p.gap + GAP / 2)) die();
        }
        if (bird.y + R >= H - GROUND) { bird.y = H - GROUND - R; die(); }
        if (bird.y - R < 0) { bird.y = R; bird.vy = 0; }
      }
      draw();
    });

    function draw() {
      const sky = g.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#4cc9f0'); sky.addColorStop(1, '#bdf0ff');
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255,255,255,.8)';
      [[60, 90], [220, 140], [300, 60]].forEach(([x, y]) => {
        g.beginPath(); g.arc(x, y, 18, 0, 7); g.arc(x + 22, y + 4, 22, 0, 7); g.arc(x + 46, y, 16, 0, 7); g.fill();
      });
      pipes.forEach(p => {
        const top = p.gap - GAP / 2, bot = p.gap + GAP / 2;
        g.fillStyle = '#3ddc84'; g.strokeStyle = '#0b6b3a'; g.lineWidth = 3;
        g.fillRect(p.x, 0, PW, top); g.strokeRect(p.x, -2, PW, top + 2);
        g.fillRect(p.x, bot, PW, H - GROUND - bot); g.strokeRect(p.x, bot, PW, H - GROUND - bot + 2);
        g.fillRect(p.x - 5, top - 22, PW + 10, 22); g.strokeRect(p.x - 5, top - 22, PW + 10, 22);
        g.fillRect(p.x - 5, bot, PW + 10, 22); g.strokeRect(p.x - 5, bot, PW + 10, 22);
      });
      g.fillStyle = '#d9b36c'; g.fillRect(0, H - GROUND, W, GROUND);
      g.fillStyle = '#6cc04a'; g.fillRect(0, H - GROUND, W, 14);
      g.fillStyle = '#b8924d';
      for (let x = -24; x < W + 24; x += 24) g.fillRect(x - scroll, H - GROUND + 30, 12, 6);
      g.save(); g.translate(bird.x, bird.y); g.rotate(clamp(bird.vy / 700, -0.5, 1));
      g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(0, 0, R, 0, 7); g.fill();
      g.strokeStyle = '#b87f00'; g.lineWidth = 2; g.stroke();
      g.fillStyle = '#ff9f1c'; g.beginPath(); g.ellipse(-4, 4, 7, 4, 0, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(6, -4, 5, 0, 7); g.fill();
      g.fillStyle = '#000'; g.beginPath(); g.arc(8, -4, 2.2, 0, 7); g.fill();
      g.fillStyle = '#ff5d3a'; g.beginPath(); g.moveTo(R - 2, 0); g.lineTo(R + 8, 3); g.lineTo(R - 2, 7); g.fill();
      g.restore();
      if (state === 'play') {
        g.fillStyle = '#fff'; g.strokeStyle = '#0006'; g.lineWidth = 5; g.font = 'bold 48px Fredoka, system-ui';
        g.textAlign = 'center'; g.textBaseline = 'top';
        g.strokeText(score, W / 2, 24); g.fillText(score, W / 2, 24);
      }
    }
    reset(); draw();
    api.overlay('Flappy Blob 🐤', 'Click, tap or press Space to flap. Squeeze through the pipes!', 'Play', begin);
  }

  /* =====================================================
     GAME 3: MEMORY MATCH
     ===================================================== */
  function memoryGame(api) {
    const emojis = ['🍎', '🍌', '🍇', '🍓', '🍉', '🍍', '🥝', '🍒'];
    const deck = shuffle(emojis.concat(emojis));
    const grid = el('div', 'mem-grid'); api.add(grid);
    let first = null, lock = false, moves = 0, matched = 0;
    api.status('Find all the pairs!');
    deck.forEach(e => {
      const b = el('button', 'mem-card', '<span class="face front">?</span><span class="face back">' + e + '</span>');
      b.type = 'button'; b.dataset.e = e;
      b.addEventListener('click', () => flip(b));
      grid.appendChild(b);
    });
    function flip(b) {
      if (lock || b.classList.contains('open') || b.classList.contains('done')) return;
      b.classList.add('open');
      if (!first) { first = b; return; }
      moves++; api.setScore(moves);
      if (first.dataset.e === b.dataset.e) {
        first.classList.add('done'); b.classList.add('done'); first = null; matched++;
        if (matched === emojis.length) {
          api.finish(moves);
          api.timeout(() => api.overlay('You win! 🎉', 'Finished in ' + moves + ' moves', 'Play again', api.restart), 500);
        }
      } else {
        lock = true; const a = first; first = null;
        api.timeout(() => { a.classList.remove('open'); b.classList.remove('open'); lock = false; }, 750);
      }
    }
  }

  /* =====================================================
     GAME 4: TIC TAC TOE (vs CPU)
     ===================================================== */
  function tttGame(api) {
    const wrap = el('div', 'ttt'); api.add(wrap);
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board, over, wins = 0, busy;
    const cells = [];
    for (let i = 0; i < 9; i++) {
      const b = el('button'); b.type = 'button';
      b.addEventListener('click', () => play(i));
      wrap.appendChild(b); cells.push(b);
    }
    function winner(b) {
      for (const [p, q, r] of lines) if (b[p] && b[p] === b[q] && b[p] === b[r]) return b[p];
      return b.includes('') ? null : 'draw';
    }
    function mm(b, isO, d) {
      const w = winner(b);
      if (w === 'O') return 10 - d; if (w === 'X') return d - 10; if (w === 'draw') return 0;
      let best = isO ? -99 : 99;
      for (let i = 0; i < 9; i++) if (!b[i]) {
        b[i] = isO ? 'O' : 'X';
        const s = mm(b, !isO, d + 1); b[i] = '';
        best = isO ? Math.max(best, s) : Math.min(best, s);
      }
      return best;
    }
    function cpuPick() {
      const free = []; board.forEach((v, i) => { if (!v) free.push(i); });
      if (Math.random() < 0.3) return free[randInt(0, free.length - 1)];
      let bestS = -99, bestI = [];
      for (const i of free) {
        board[i] = 'O'; const s = mm(board, false, 1); board[i] = '';
        if (s > bestS) { bestS = s; bestI = [i]; } else if (s === bestS) bestI.push(i);
      }
      return bestI[randInt(0, bestI.length - 1)];
    }
    function paint() {
      cells.forEach((b, i) => {
        b.textContent = board[i]; b.className = board[i] ? board[i].toLowerCase() : '';
      });
    }
    function newRound() {
      board = Array(9).fill(''); over = false; busy = false; paint();
      api.hideOverlay(); api.status('Your turn! You are ❌');
    }
    function finishRound(res) {
      over = true;
      const line = lines.find(([p, q, r]) => board[p] && board[p] === board[q] && board[p] === board[r]);
      if (line) line.forEach(i => cells[i].classList.add('win'));
      let title;
      if (res === 'X') { wins++; api.setScore(wins); api.finish(wins); title = 'You win! 🎉'; }
      else if (res === 'O') title = 'CPU wins 🤖';
      else title = "It's a draw 🤝";
      api.status(title);
      api.timeout(() => api.overlay(title, 'Wins this session: ' + wins, 'Next round', newRound), 900);
    }
    function play(i) {
      if (over || busy || board[i]) return;
      board[i] = 'X'; paint();
      let r = winner(board);
      if (r) return finishRound(r);
      busy = true; api.status('CPU is thinking…');
      api.timeout(() => {
        board[cpuPick()] = 'O'; paint(); busy = false;
        r = winner(board);
        if (r) finishRound(r); else api.status('Your turn! You are ❌');
      }, 400);
    }
    newRound();
  }

  /* =====================================================
     GAME 5: PADDLE PONG (survival)
     ===================================================== */
  function pongGame(api) {
    const W = 480, H = 320, PW = 10, PH = 64, R = 7, PX = 14;
    const c = api.canvas(W, H), g = c.getContext('2d');
    let py = H / 2 - PH / 2, cy = py, ball, lives = 3, score = 0, state = 'idle', pause = 0;
    const keys = { up: false, down: false };

    function serve() {
      const a = rand(-0.5, 0.5), sp = 250;
      ball = { x: W / 2, y: H / 2, vx: Math.cos(a) * sp * (Math.random() < 0.5 ? -1 : 1), vy: Math.sin(a) * sp };
      pause = 0.8;
    }
    function hud() {
      api.setScore(score);
      api.status('Lives ' + '♥'.repeat(lives) + '♡'.repeat(3 - lives));
    }
    function begin() { score = 0; lives = 3; py = H / 2 - PH / 2; cy = py; serve(); state = 'play'; api.hideOverlay(); hud(); }
    function end() {
      state = 'over'; api.finish(score);
      api.overlay('Game over', 'You returned the ball ' + score + ' times', 'Play again', begin);
    }
    function bounce(paddleY, dir) {
      const rel = clamp((ball.y - (paddleY + PH / 2)) / (PH / 2), -1, 1);
      const sp = Math.min(720, Math.hypot(ball.vx, ball.vy) * 1.06);
      const ang = rel * 0.9;
      ball.vx = Math.cos(ang) * sp * dir; ball.vy = Math.sin(ang) * sp;
    }
    api.on(window, 'keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { keys.up = true; e.preventDefault(); }
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { keys.down = true; e.preventDefault(); }
      else if (e.key === ' ') { e.preventDefault(); if (state !== 'play' && !e.repeat) begin(); }
    });
    api.on(window, 'keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
    });
    api.on(c, 'pointermove', e => { py = clamp(canvasPos(c, e).y - PH / 2, 0, H - PH); });
    api.on(c, 'pointerdown', e => { py = clamp(canvasPos(c, e).y - PH / 2, 0, H - PH); });

    api.loop(dt => {
      if (state === 'play') {
        if (keys.up) py -= 380 * dt; if (keys.down) py += 380 * dt;
        py = clamp(py, 0, H - PH);
        const target = ball.vx > 0 ? ball.y - PH / 2 : H / 2 - PH / 2;
        cy += clamp(target - cy, -185 * dt, 185 * dt); cy = clamp(cy, 0, H - PH);
        if (pause > 0) pause -= dt;
        else {
          ball.x += ball.vx * dt; ball.y += ball.vy * dt;
          if (ball.y < R) { ball.y = R; ball.vy = Math.abs(ball.vy); }
          if (ball.y > H - R) { ball.y = H - R; ball.vy = -Math.abs(ball.vy); }
          if (ball.vx < 0 && ball.x - R <= PX + PW && ball.x - R >= PX - 6 && ball.y > py - R && ball.y < py + PH + R) {
            ball.x = PX + PW + R; bounce(py, 1); score++; hud();
          }
          const cx = W - PX - PW;
          if (ball.vx > 0 && ball.x + R >= cx && ball.x + R <= cx + PW + 6 && ball.y > cy - R && ball.y < cy + PH + R) {
            ball.x = cx - R; bounce(cy, -1);
          }
          if (ball.x < -R) { lives--; hud(); if (lives <= 0) end(); else serve(); }
          else if (ball.x > W + R) { score += 5; hud(); serve(); }
        }
      }
      draw();
    });
    function draw() {
      g.fillStyle = '#0b1b3a'; g.fillRect(0, 0, W, H);
      g.strokeStyle = 'rgba(255,255,255,.25)'; g.setLineDash([10, 12]); g.lineWidth = 3;
      g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#22e4ff'; roundRect(g, PX, py, PW, PH, 5); g.fill();
      g.fillStyle = '#ff4fa3'; roundRect(g, W - PX - PW, cy, PW, PH, 5); g.fill();
      if (ball) { g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(ball.x, ball.y, R, 0, 7); g.fill(); }
      g.fillStyle = 'rgba(255,255,255,.7)'; g.font = 'bold 20px Fredoka, system-ui'; g.textAlign = 'left'; g.textBaseline = 'top';
      g.fillText('♥'.repeat(lives), 12, 8);
    }
    serve(); draw();
    api.overlay('Paddle Pong 🏓', 'Move your mouse / finger (or W & S). Return the ball to score. Miss it and lose a life!', 'Play', begin);
  }

  /* =====================================================
     GAME 6: BRICK SMASH
     ===================================================== */
  function breakoutGame(api) {
    const W = 360, H = 480, COLS = 8, BW = W / COLS, BH = 22, TOP = 56;
    const colors = ['#ff4f6d', '#ff9f43', '#ffd23f', '#3dff9a', '#22e4ff', '#a78bfa', '#f472b6', '#60a5fa', '#fb7185'];
    const c = api.canvas(W, H), g = c.getContext('2d');
    const paddle = { w: 80, h: 12, x: W / 2 - 40, y: H - 38 };
    let ball, bricks = [], score = 0, lives = 3, level = 1, state = 'idle', left = false, right = false;

    function build() {
      bricks = [];
      const rows = Math.min(4 + level, 9);
      for (let r = 0; r < rows; r++) for (let k = 0; k < COLS; k++) bricks.push({ x: k * BW, y: TOP + r * BH, alive: true, col: colors[r % colors.length] });
    }
    function stick() { ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 7, r: 7, vx: 0, vy: 0, stuck: true }; }
    function hud() { api.setScore(score); api.status('Level ' + level + '   ·   Lives ' + '♥'.repeat(Math.max(0, lives))); }
    function begin() { score = 0; lives = 3; level = 1; paddle.x = W / 2 - paddle.w / 2; build(); stick(); state = 'play'; api.hideOverlay(); hud(); }
    function launch() {
      if (state === 'play' && ball.stuck) {
        const sp = 320 + level * 30, a = rand(-0.45, 0.45);
        ball.vx = sp * Math.sin(a); ball.vy = -sp * Math.cos(a); ball.stuck = false;
      }
    }
    function end() { state = 'over'; api.finish(score); api.overlay('Game over', 'Score ' + score + ' · level ' + level, 'Play again', begin); }
    api.on(window, 'keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { left = true; e.preventDefault(); }
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { right = true; e.preventDefault(); }
      else if (e.key === ' ') { e.preventDefault(); if (state === 'play') launch(); else if (!e.repeat) begin(); }
    });
    api.on(window, 'keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') right = false;
    });
    api.on(c, 'pointermove', e => { paddle.x = clamp(canvasPos(c, e).x - paddle.w / 2, 0, W - paddle.w); });
    api.on(c, 'pointerdown', e => { paddle.x = clamp(canvasPos(c, e).x - paddle.w / 2, 0, W - paddle.w); launch(); });

    api.loop(dt => {
      if (state === 'play') {
        if (left) paddle.x -= 430 * dt; if (right) paddle.x += 430 * dt;
        paddle.x = clamp(paddle.x, 0, W - paddle.w);
        if (ball.stuck) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r; }
        else {
          ball.x += ball.vx * dt; ball.y += ball.vy * dt;
          if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
          if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
          if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
          if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 10 &&
              ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
            const rel = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
            const sp = Math.hypot(ball.vx, ball.vy), ang = rel * 1.0;
            ball.vx = sp * Math.sin(ang); ball.vy = -sp * Math.cos(ang); ball.y = paddle.y - ball.r;
          }
          for (const b of bricks) {
            if (!b.alive) continue;
            const nx = clamp(ball.x, b.x, b.x + BW), ny = clamp(ball.y, b.y, b.y + BH);
            const dx = ball.x - nx, dy = ball.y - ny;
            if (dx * dx + dy * dy <= ball.r * ball.r) {
              b.alive = false; score += 10 * level; hud();
              if (Math.abs(dx) > Math.abs(dy)) ball.vx = -ball.vx; else ball.vy = -ball.vy;
              break;
            }
          }
          if (ball.y > H + ball.r) { lives--; hud(); if (lives <= 0) end(); else stick(); }
        }
        if (state === 'play' && bricks.every(b => !b.alive)) { level++; lives = Math.min(5, lives + 1); build(); stick(); hud(); }
      }
      draw();
    });
    function draw() {
      g.fillStyle = '#10133a'; g.fillRect(0, 0, W, H);
      bricks.forEach(b => {
        if (!b.alive) return;
        g.fillStyle = b.col; roundRect(g, b.x + 1.5, b.y + 1.5, BW - 3, BH - 3, 5); g.fill();
        g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(b.x + 5, b.y + 4, BW - 10, 3);
      });
      g.fillStyle = '#22e4ff'; roundRect(g, paddle.x, paddle.y, paddle.w, paddle.h, 6); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(ball.x, ball.y, ball.r, 0, 7); g.fill();
      if (state === 'play' && ball.stuck) {
        g.fillStyle = 'rgba(255,255,255,.8)'; g.font = '600 16px Fredoka, system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('Click or press Space to launch', W / 2, H - 80);
      }
    }
    build(); stick(); draw();
    api.overlay('Brick Smash 🧱', 'Move the paddle with your mouse, finger or arrow keys. Break every brick!', 'Play', begin);
  }

  /* =====================================================
     GAME 7: NUMBER MERGE (2048 style)
     ===================================================== */
  function mergeGame(api) {
    const wrap = el('div', 'n2048'); api.add(wrap);
    const tiles = [];
    for (let i = 0; i < 16; i++) { const t = el('div', 'tile'); wrap.appendChild(t); tiles.push(t); }
    let grid = Array(16).fill(0), score = 0, won = false, over = false;

    function slide(row) {
      const arr = row.filter(v => v), out = []; let gained = 0;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] === arr[i + 1]) { out.push(arr[i] * 2); gained += arr[i] * 2; i++; } else out.push(arr[i]);
      }
      while (out.length < 4) out.push(0);
      return { out, gained };
    }
    function move(d) { // 0 left, 1 up, 2 right, 3 down
      let moved = false, gained = 0;
      for (let i = 0; i < 4; i++) {
        const idx = [0, 1, 2, 3].map(j => d === 0 ? i * 4 + j : d === 2 ? i * 4 + (3 - j) : d === 1 ? j * 4 + i : (3 - j) * 4 + i);
        const res = slide(idx.map(k => grid[k]));
        gained += res.gained;
        idx.forEach((k, j) => { if (grid[k] !== res.out[j]) moved = true; grid[k] = res.out[j]; });
      }
      return { moved, gained };
    }
    function addTile() {
      const free = []; grid.forEach((v, i) => { if (!v) free.push(i); });
      if (free.length) grid[free[randInt(0, free.length - 1)]] = Math.random() < 0.9 ? 2 : 4;
    }
    function canMove() {
      for (let i = 0; i < 16; i++) {
        if (!grid[i]) return true;
        const r = Math.floor(i / 4), k = i % 4;
        if (k < 3 && grid[i] === grid[i + 1]) return true;
        if (r < 3 && grid[i] === grid[i + 4]) return true;
      }
      return false;
    }
    function render() {
      tiles.forEach((t, i) => {
        const v = grid[i];
        t.textContent = v || '';
        t.className = 'tile' + (v ? ' v' + (v > 2048 ? 'big' : v) : '');
      });
      api.setScore(score);
    }
    function act(d) {
      if (over) return;
      const r = move(d);
      if (!r.moved) return;
      score += r.gained; addTile(); render(); api.finish(score);
      if (!won && grid.includes(2048)) { won = true; api.status('You made 2048! Keep going! 🎉'); }
      if (!canMove()) {
        over = true; api.status('No more moves!');
        api.timeout(() => api.overlay('Game over', 'Score ' + score, 'Play again', api.restart), 600);
      }
    }
    const keymap = {
      ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3,
      a: 0, w: 1, d: 2, s: 3, A: 0, W: 1, D: 2, S: 3
    };
    api.on(window, 'keydown', e => { if (keymap[e.key] !== undefined) { e.preventDefault(); act(keymap[e.key]); } });
    let sx = 0, sy = 0;
    api.on(wrap, 'pointerdown', e => { sx = e.clientX; sy = e.clientY; });
    api.on(wrap, 'pointerup', e => {
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) act(dx > 0 ? 2 : 0); else act(dy > 0 ? 3 : 1);
    });
    addTile(); addTile(); render();
    api.status('Arrow keys / swipe to slide the tiles');
  }

     GAME 8: WHACK-A-CRITTER
     ===================================================== */
  function whackGame(api) {
    const grid = el('div', 'whack'); api.add(grid);
    const holes = []; let running = false, score = 0, timeLeft = 30, iv = null;
    for (let i = 0; i < 9; i++) {
      const b = el('button', 'hole', '<span class="critter"></span>'); b.type = 'button';
      const h = { b, span: b.firstChild, active: false, type: 'normal' };
      b.addEventListener('pointerdown', e => { e.preventDefault(); hit(h); });
      grid.appendChild(b); holes.push(h);
    }
    const icons = { normal: '🐹', gold: '🌟', bomb: '💣' };
    function show(h) {
      const r = Math.random();
      h.type = r < 0.12 ? 'bomb' : r < 0.22 ? 'gold' : 'normal';
      h.span.textContent = icons[h.type]; h.active = true; h.b.classList.add('up');
      const stay = Math.max(450, 1000 - (30 - timeLeft) * 14) + rand(-100, 150);
      api.timeout(() => hide(h), stay);
    }
    function hide(h) { h.active = false; h.b.classList.remove('up'); }
    function hit(h) {
      if (!running || !h.active) return;
      hide(h);
      score += h.type === 'bomb' ? -3 : h.type === 'gold' ? 3 : 1;
      if (score < 0) score = 0;
      api.setScore(score);
    }
    function spawnLoop() {
      if (!running) return;
      const free = holes.filter(h => !h.active);
      if (free.length) show(free[randInt(0, free.length - 1)]);
      api.timeout(spawnLoop, Math.max(280, 750 - (30 - timeLeft) * 13));
    }
    function end() {
      running = false; holes.forEach(hide); api.finish(score);
      api.overlay("Time's up! ⏰", 'You scored ' + score + ' points', 'Play again', begin);
    }
    function begin() {
      running = true; score = 0; timeLeft = 30; api.setScore(0); api.hideOverlay(); api.status('Time: 30s');
      spawnLoop();
      iv = api.interval(() => {
        timeLeft--; api.status('Time: ' + timeLeft + 's');
        if (timeLeft <= 0) { clearInterval(iv); end(); }
      }, 1000);
    }
    api.overlay('Whack-a-Critter 🔨', 'Tap the 🐹 (+1) and 🌟 (+3). Avoid the 💣 (-3)! You have 30 seconds.', 'Play', begin);
  }

  /* =====================================================
     GAME 9: JUMP RUNNER
     ===================================================== */
  function runnerGame(api) {
    const W = 600, H = 240, GROUND = 190;
    const c = api.canvas(W, H), g = c.getContext('2d');
    const p = { x: 70, y: GROUND - 40, w: 36, h: 40, vy: 0, onGround: true };
    let obs = [], speed = 270, dist = 0, state = 'idle', spawnIn = 1, deadAt = 0, lastScore = 0, scroll = 0;

    function begin() {
      p.y = GROUND - p.h; p.vy = 0; p.onGround = true;
      obs = []; speed = 270; dist = 0; spawnIn = 0.9; lastScore = 0; state = 'play';
      api.hideOverlay(); api.setScore(0);
    }
    function jump() {
      if (state === 'play') { if (p.onGround) { p.vy = -650; p.onGround = false; } }
      else if (performance.now() - deadAt > 500) begin();
    }
    function die() {
      state = 'dead'; deadAt = performance.now();
      const s = Math.floor(dist / 10); api.finish(s);
      api.overlay('Ouch! 💥', 'Distance: ' + s + ' m', 'Run again', begin);
    }
    api.on(window, 'keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!e.repeat) jump(); }
    });
    api.on(c, 'pointerdown', e => { e.preventDefault(); jump(); });

    api.loop(dt => {
      if (state === 'play') {
        dist += speed * dt; speed = Math.min(640, speed + 9 * dt);
        scroll = (scroll + speed * dt) % 40;
        const s = Math.floor(dist / 10);
        if (s !== lastScore) { lastScore = s; api.setScore(s); }
        p.vy += 2000 * dt; p.y += p.vy * dt;
        if (p.y >= GROUND - p.h) { p.y = GROUND - p.h; p.vy = 0; p.onGround = true; }
        spawnIn -= dt;
        if (spawnIn <= 0) {
          const h = randInt(34, 58), w = randInt(18, 28);
          obs.push({ x: W + 20, w, h });
          if (Math.random() < 0.3) obs.push({ x: W + 20 + w + 6, w: randInt(18, 26), h: randInt(30, 50) });
          spawnIn = rand(0.95, 1.7);
        }
        obs.forEach(o => o.x -= speed * dt);
        obs = obs.filter(o => o.x + o.w > -10);
        for (const o of obs) {
          if (p.x + 6 < o.x + o.w - 3 && p.x + p.w - 6 > o.x + 3 && p.y + 6 < GROUND && p.y + p.h > GROUND - o.h + 4) { die(); break; }
        }
      }
      draw();
    });
    function draw() {
      const sky = g.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#9ad8ff'); sky.addColorStop(1, '#e8f7ff');
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255,255,255,.85)';
      [[100, 50], [330, 35], [520, 70]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 14, 0, 7); g.arc(x + 18, y + 3, 18, 0, 7); g.arc(x + 38, y, 12, 0, 7); g.fill(); });
      g.fillStyle = '#e2b974'; g.fillRect(0, GROUND, W, H - GROUND);
      g.fillStyle = '#6cc04a'; g.fillRect(0, GROUND, W, 8);
      g.fillStyle = '#b8924d';
      for (let x = -40; x < W + 40; x += 40) g.fillRect(x - scroll, GROUND + 26, 16, 5);
      obs.forEach(o => {
        g.fillStyle = '#2f9e44'; roundRect(g, o.x, GROUND - o.h, o.w, o.h, 6); g.fill();
        g.fillStyle = '#237a35'; g.fillRect(o.x + o.w / 2 - 1, GROUND - o.h + 6, 2, o.h - 10);
      });
      // player (little fox)
      g.fillStyle = '#ff8a2b'; roundRect(g, p.x, p.y, p.w, p.h, 9); g.fill();
      g.beginPath(); g.moveTo(p.x + 4, p.y + 4); g.lineTo(p.x + 9, p.y - 9); g.lineTo(p.x + 16, p.y + 4); g.fill();
      g.beginPath(); g.moveTo(p.x + 20, p.y + 4); g.lineTo(p.x + 27, p.y - 9); g.lineTo(p.x + 32, p.y + 4); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(p.x + 25, p.y + 14, 5, 0, 7); g.fill();
      g.fillStyle = '#000'; g.beginPath(); g.arc(p.x + 27, p.y + 14, 2.3, 0, 7); g.fill();
      g.fillStyle = '#ffe2c2'; roundRect(g, p.x + 6, p.y + 24, 24, 12, 5); g.fill();
      if (state === 'play') {
        g.fillStyle = '#1b0a40'; g.font = 'bold 22px Fredoka, system-ui'; g.textAlign = 'right'; g.textBaseline = 'top';
        g.fillText(lastScore + ' m', W - 14, 10);
      }
    }
    draw();
    api.overlay('Jump Runner 🦊', 'Press Space / ↑ or tap to jump over the cacti. You get faster and faster!', 'Run', begin);
  }

  /* =====================================================
     GAME 10: MINESWEEPER
     ===================================================== */
  function minesGame(api) {
    const R = 9, C = 9, M = 10;
    const wrap = el('div', 'mines-wrap');
    const flagBtn = el('button', 'btn small ghost', '🚩 Flag mode: off'); flagBtn.type = 'button';
    const grid = el('div', 'mines');
    wrap.appendChild(flagBtn); wrap.appendChild(grid); api.add(wrap);
    const cells = []; let first = true, over = false, flagMode = false, time = 0, flags = 0, opened = 0, iv = null;

    flagBtn.addEventListener('click', () => { flagMode = !flagMode; flagBtn.textContent = '🚩 Flag mode: ' + (flagMode ? 'ON' : 'off'); });
    for (let i = 0; i < R * C; i++) {
      const b = el('button', 'mcell'); b.type = 'button';
      b.addEventListener('click', () => { if (flagMode) toggle(i); else reveal(i); });
      b.addEventListener('contextmenu', e => { e.preventDefault(); toggle(i); });
      grid.appendChild(b); cells.push({ b, mine: false, adj: 0, open: false, flag: false });
    }
    function hud() { api.status('💣 ' + (M - flags) + ' left   ·   ⏱ ' + time + 's'); }
    function neighbors(i) {
      const r = Math.floor(i / C), k = i % C, out = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = k + dc;
        if (nr >= 0 && nr < R && nc >= 0 && nc < C) out.push(nr * C + nc);
      }
      return out;
    }
    function placeMines(safe) {
      const bad = new Set([safe].concat(neighbors(safe)));
      let n = 0;
      while (n < M) { const i = randInt(0, R * C - 1); if (bad.has(i) || cells[i].mine) continue; cells[i].mine = true; n++; }
      cells.forEach((cl, i) => { cl.adj = neighbors(i).filter(j => cells[j].mine).length; });
    }
    function paint(i) {
      const cl = cells[i], b = cl.b;
      b.className = 'mcell'; b.textContent = '';
      if (cl.open) { b.classList.add('open'); if (cl.adj) { b.textContent = cl.adj; b.classList.add('n' + cl.adj); } }
      else if (cl.flag) b.textContent = '🚩';
    }
    function toggle(i) {
      if (over || first) return;
      const cl = cells[i]; if (cl.open) return;
      cl.flag = !cl.flag; flags += cl.flag ? 1 : -1; paint(i); hud();
    }
    function reveal(i) {
      if (over) return;
      const cl = cells[i]; if (cl.open || cl.flag) return;
      if (first) {
        first = false; placeMines(i);
        iv = api.interval(() => { time++; api.setScore(time); hud(); }, 1000);
      }
      if (cl.mine) return lose(i);
      const stack = [i];
      while (stack.length) {
        const k = stack.pop(), ck = cells[k];
        if (ck.open || ck.flag) continue;
        ck.open = true; opened++; paint(k);
        if (ck.adj === 0) neighbors(k).forEach(n => { if (!cells[n].open && !cells[n].flag) stack.push(n); });
      }
      if (opened === R * C - M) win();
    }
    function lose(hitIdx) {
      over = true; clearInterval(iv);
      cells.forEach(cl => { if (cl.mine) { cl.b.className = 'mcell open bomb'; cl.b.textContent = '💣'; } });
      cells[hitIdx].b.className = 'mcell open boom';
      api.timeout(() => api.overlay('Boom! 💥', 'You hit a mine.', 'Try again', api.restart), 700);
    }
    function win() {
      over = true; clearInterval(iv); api.finish(time);
      api.timeout(() => api.overlay('You win! 🎉', 'Cleared in ' + time + ' seconds', 'Play again', api.restart), 400);
    }
    hud();
  }

    const stage = $('#stage'), scoreEl = $('#gv-score'), bestEl = $('#gv-best'), statusEl = $('#gv-status');
    let api = null, board = null, ov = null;

    const bestText = () => { const b = bestOf(def); return b == null ? '-' : fmtBest(def, b); };

    function makeApi() {
      const cleanups = [];
      const a = {
        stage, board,
        add(node) { board.insertBefore(node, ov); return node; },
        canvas(w, h) {
          const cv = el('canvas', 'game-canvas'); cv.width = w; cv.height = h;
          cv.style.width = 'min(94vw, ' + w + 'px)';
          a.add(cv); return cv;
        },
        on(target, type, fn, opts) { target.addEventListener(type, fn, opts); cleanups.push(() => target.removeEventListener(type, fn, opts)); },
        interval(fn, ms) { const id = setInterval(fn, ms); cleanups.push(() => clearInterval(id)); return id; },
        timeout(fn, ms) { const id = setTimeout(fn, ms); cleanups.push(() => clearTimeout(id)); return id; },
        onCleanup(fn) { cleanups.push(fn); },
        loop(fn) {
          let last = performance.now(), id = 0, alive = true;
          const frame = now => {
            if (!alive) return;
            const dt = Math.min(0.05, (now - last) / 1000); last = now;
            fn(dt); id = requestAnimationFrame(frame);
          };
          id = requestAnimationFrame(frame);
          cleanups.push(() => { alive = false; cancelAnimationFrame(id); });
        },
        setScore(n) { scoreEl.textContent = n; },
        status(t) { statusEl.textContent = t; },
        finish(score) {

        hideOverlay() { ov.classList.add('hidden'); },
        dpad(fn) {
          const d = el('div', 'dpad');
          [['up', '▲'], ['left', '◀'], ['down', '▼'], ['right', '▶']].forEach(([dir, ch]) => {
            const b = el('button', dir, ch); b.type = 'button'; b.setAttribute('aria-label', dir);
            b.addEventListener('click', () => fn(dir)); d.appendChild(b);
          });
          stage.appendChild(d);
        },
        restart() { start(); },
        cleanup() { cleanups.splice(0).reverse().forEach(f => { try { f(); } catch (e) {} }); }
      };
      return a;
    }

    function start() {
      if (api) api.cleanup();
      stage.innerHTML = '';

      board.appendChild(ov); stage.appendChild(board);

  function route() {
    if (current) { current.cleanup(); current = null; }
    const id = location.hash.replace(/^#\/?/, '');
    const def = GAMES.find(g => g.id === id);
    window.scrollTo(0, 0);
    if (def) showGame(def); else showHome();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
